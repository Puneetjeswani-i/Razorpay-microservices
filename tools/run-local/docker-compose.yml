# Infrastructure for running the microservices on one machine.
# Matches the local (non-k8s) settings in the config repo:
#   PostgreSQL localhost:5432 (anuj / password, one database per service)
#   Redis      localhost:6379
#   Kafka      localhost:29092
#   Zipkin     localhost:9411
name: razorpay-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: rzp-postgres
    # Each service's Hikari pool allows 50 connections (config repo), 4 services -> up to 200.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: anuj
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anuj -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rzp-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  kafka:
    image: confluentinc/confluent-local:7.5.0
    container_name: rzp-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "6PMpHYL9QkeyXRj9Nrp4KA"
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  zipkin:
    image: openzipkin/zipkin:3
    container_name: rzp-zipkin
    ports:
      - "9411:9411"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  kafka-data:
